name: f:mail bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  binary:
    name: Linux-Binary
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.11'
          cache-dependency-path: fmail/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fmail/frontend/package-lock.json
      - name: Linux-Systemabhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config build-essential
      - name: Frontend installieren, prüfen und bauen
        working-directory: fmail/frontend
        run: |
          npm ci
          npm audit
          npm run build

      - name: Go-Module und Tests prüfen
        working-directory: fmail
        run: |
          go mod verify
          go test -tags gtk3 ./...

      - name: Go-Code statisch prüfen
        working-directory: fmail
        run: |
          go vet -tags gtk3 ./...

      - name: Go-Abhängigkeiten auf Schwachstellen prüfen
        working-directory: fmail
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -tags gtk3 ./...
      - name: Linux-Binary bauen
        working-directory: fmail
        run: |
          mkdir -p bin
          go build -tags production,gtk3 -trimpath -buildvcs=false -ldflags="-w -s" -o bin/fmail .
      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: fmail-linux
          path: fmail/bin/fmail
          if-no-files-found: error

  flatpak:
    name: Flatpak
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      # Das fertige Vite-Verzeichnis wird vom Go-Compiler eingebettet.
      # Node muss deshalb nicht innerhalb des Flatpak-Sandboxes laufen.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fmail/frontend/package-lock.json
      - name: Frontend bauen
        working-directory: fmail/frontend
        run: |
          npm ci
          npm run build
      - name: Flatpak bauen
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: fmail.flatpak
          manifest-path: digital.franky.Fmail.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: fmail-flatpak
          path: fmail.flatpak
          if-no-files-found: error

  release:
    name: GitHub-Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binary, flatpak]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: fmail-linux
          path: release
      - uses: actions/download-artifact@v5
        with:
          name: fmail-flatpak
          path: release
      - name: GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/fmail release/fmail.flatpak --generate-notes --title "f:mail $GITHUB_REF_NAME"
