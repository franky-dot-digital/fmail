name: f:mail bauen

# Läuft bei jedem Push und lässt sich zusätzlich manuell anstoßen
# (Actions-Tab → "f:mail bauen" → "Run workflow").
#
# Nur noch Linux -- macOS/Windows sind bewusst raus, siehe README
# (Open-Source-Projekt ohne Budget für Code-Signing-Zertifikate).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  binary:
    # Rohes Linux-Binary, direkt lauffähig, kein Flatpak-Sandbox drumrum --
    # gut zum schnellen Testen, z. B. mit dem Docker-Setup aus README.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Linux-Systemabhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config build-essential

      - name: Wails-CLI installieren
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.9

      - name: Abhängigkeiten und Sicherheitsprüfungen
        working-directory: fmail
        run: |
          go mod verify
          go test ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          cd frontend
          npm ci
          npm audit
          npm run build

      - name: Bauen
        working-directory: fmail
        shell: bash
        # -tags gtk3: Ubuntu 22.04 (und openSUSE Leap) liefern WebKitGTK 4.1,
        # nicht das von Wails v3 standardmäßig erwartete 6.0.
        run: wails3 build -tags gtk3

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: fmail-linux-binary
          path: fmail/bin
          if-no-files-found: error

  flatpak:
    # Das Manifest ist statisch geprüft; der vollständige Bundle-Build läuft
    # erstmals in dieser isolierten CI-Umgebung.
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: fmail.flatpak
          manifest-path: flatpak/digital.franky.Fmail.yml
          cache-key: flatpak-builder-${{ github.sha }}
