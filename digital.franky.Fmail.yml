# GitHub-Release-Manifest für f:mail. Es ist bewusst nicht für eine
# Einreichung bei Flathub vorbereitet: Go-Module werden beim Bau geladen.
id: digital.franky.Fmail
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: fmail

finish-args:
  - --share=network
  - --share=ipc
  # WebKitGTK auf Flatpak 1.16.0 kann den Web-Prozess sonst nicht starten
  # (Portal-Fehler: "failed to receive credentials"). Die äußere Flatpak-
  # Sandbox bleibt aktiv; nur die zusätzliche WebKit-Sandbox ist deaktiviert.
  - --env=WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --filesystem=xdg-config/fmail:create

modules:
  - name: fmail
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - |
        curl -fsSL "https://go.dev/dl/go1.25.14.linux-amd64.tar.gz" -o go.tar.gz
        echo "a21ae5633a269bcd7e90cf767e48225633795e99d831742cbf3397064fee7712  go.tar.gz" | sha256sum -c -
        mkdir -p .goroot
        tar -C .goroot -xzf go.tar.gz --strip-components=1
        rm go.tar.gz
      - |
        set -e
        export PATH=$PWD/.goroot/bin:$PATH
        export GOCACHE=/tmp/go-build-cache
        cd fmail
        go mod verify
        go mod download github.com/wailsapp/wails/v3
        WAILS_DIR="$(go env GOMODCACHE)/github.com/wailsapp/wails/v3@v3.0.0-beta.9"
        cp -a "${WAILS_DIR}" .wails-flatpak
        chmod -R u+w .wails-flatpak
        patch -d .wails-flatpak -p1 < ../flatpak/wails-flatpak-app-id.patch
        go mod edit -replace github.com/wailsapp/wails/v3=./.wails-flatpak
        mkdir -p bin
        go build -tags production -trimpath -buildvcs=false -ldflags="-w -s" -o bin/fmail .
      - install -Dm755 fmail/bin/fmail "${FLATPAK_DEST}/bin/fmail"
      - install -Dm644 flatpak/digital.franky.Fmail.desktop "${FLATPAK_DEST}/share/applications/digital.franky.Fmail.desktop"
      - install -Dm644 flatpak/digital.franky.Fmail.metainfo.xml "${FLATPAK_DEST}/share/metainfo/digital.franky.Fmail.metainfo.xml"
      - install -Dm644 flatpak/icon.svg "${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/digital.franky.Fmail.svg"
      - install -Dm644 LICENSE "${FLATPAK_DEST}/share/licenses/digital.franky.Fmail/LICENSE"
    sources:
      - type: dir
        path: .
        skip:
          - .git
          - .github
          - fmail/bin
          - fmail/frontend/node_modules
