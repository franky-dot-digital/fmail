# Flatpak-Manifest für f:mail.
#
# GNOME 50 ist der stabile Runtime-Zweig zum Audit-Stand September 2026.
#
# Netzwerkzugriff BEIM BAUEN (build-args: --share=network) ist bewusst
# gesetzt, weil go/npm-Abhängigkeiten hier nicht vorab vendored sind --
# für den Eigenbedarf/GitHub-Release völlig in Ordnung, für eine offizielle
# Flathub-Einreichung müsste das später durch gepinnte, offline verfügbare
# Quellen ersetzt werden (siehe Kommentar unten bei "modules").

id: digital.franky.Fmail
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: fmail

finish-args:
  # IMAP/SMTP-Verbindungen
  - --share=network
  # Fenster anzeigen (Wayland nativ, X11 als Fallback)
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Passwort-Speicherung über den Secret-Service-D-Bus-Dienst
  # (GNOME Keyring / KWallet) -- entspricht internal/secrets/secrets.go
  - --talk-name=org.freedesktop.secrets
  # SQLite-DB liegt unter ~/.config/fmail, siehe main.go (os.UserConfigDir)
  - --filesystem=xdg-config/fmail:create

modules:
  - name: fmail
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      # Go-Toolchain laden (wails3 verlangt >= 1.25). Direkter Download
      # statt org.freedesktop.Sdk.Extension.golang, damit die Version
      # sicher zur Wails-Anforderung passt statt von der SDK-Extension
      # abzuhängen.
      - |
        curl -fsSL "https://go.dev/dl/go1.25.11.linux-amd64.tar.gz" -o /tmp/go.tar.gz
        echo "34f14304e856893f4ba30c2cacfe93906e9de7915c5f6aaaf3a81cdccd7ba30b  /tmp/go.tar.gz" | sha256sum -c -
        mkdir -p /tmp/goroot
        tar -C /tmp/goroot -xzf /tmp/go.tar.gz --strip-components=1
        rm /tmp/go.tar.gz

      # Gepinnte Wails-CLI passend zum eingecheckten go.mod.
      - |
        export PATH=/tmp/goroot/bin:$HOME/go/bin:$PATH
        export GOPATH=$HOME/go
        go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.9

      - |
        export PATH=/tmp/goroot/bin:$HOME/go/bin:$PATH
        export GOPATH=$HOME/go
        cd fmail
        go mod verify
        cd frontend && npm ci && npm run build && cd ..
        wails3 build

      - |
        install -Dm755 fmail/bin/fmail \
          "${FLATPAK_DEST}/bin/fmail"
        install -Dm644 flatpak/digital.franky.Fmail.desktop \
          "${FLATPAK_DEST}/share/applications/digital.franky.Fmail.desktop"
        install -Dm644 flatpak/digital.franky.Fmail.metainfo.xml \
          "${FLATPAK_DEST}/share/metainfo/digital.franky.Fmail.metainfo.xml"
        install -Dm644 flatpak/icon.svg \
          "${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/digital.franky.Fmail.svg"

    sources:
      - type: dir
        path: ..
